<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Spotlight shape for components/ui/svg-mask-effect.tsx. The Aceternity
    registry references /mask.svg but does not ship it, so this is ours.

    Only alpha matters: opaque areas show the masked layer, transparent areas
    hide it. A soft-edged radial keeps the reveal from looking like a cookie
    cutter, which is what a hard circle gives at large mask-size values.
  -->
  <defs>
    <radialGradient id="spotlight">
      <stop offset="0%" stop-color="#fff" stop-opacity="1" />
      <stop offset="55%" stop-color="#fff" stop-opacity="1" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#spotlight)" />
</svg>
