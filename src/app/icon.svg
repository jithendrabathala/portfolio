<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Code and connection mark">
  <rect width="32" height="32" rx="7" fill="#0a0a0b"/>
  <g fill="none" stroke="#f49329" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Angle brackets: the universal "code" mark, legible down to 16px. -->
    <path d="M11.5 10.5 L6.5 16 L11.5 21.5"/>
    <path d="M20.5 10.5 L25.5 16 L20.5 21.5"/>
    <!-- The slash between them doubles as a link, with a node at each end. -->
    <path d="M14 20.5 L18 11.5"/>
  </g>
  <circle cx="14" cy="20.5" r="2.1" fill="#f49329"/>
  <circle cx="18" cy="11.5" r="2.1" fill="#f49329"/>
</svg>
