<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="FILE STORAGE SYSTEM">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151b"/>
      <stop offset="1" stop-color="#22222c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f49329" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1600" height="1080" fill="url(#g)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <g stroke="#f49329" stroke-width="3" fill="none" stroke-opacity="0.85">
    <path d="M56 56 H176 M56 56 V176"/>
    <path d="M1544 56 H1424 M1544 56 V176"/>
    <path d="M56 1024 H176 M56 1024 V904"/>
    <path d="M1544 1024 H1424 M1544 1024 V904"/>
  </g>

  <text x="96" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="150" font-weight="700" fill="#f49329" fill-opacity="0.9">03</text>

  <!-- Write path: object API → queue → transform workers → store. -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g fill="none" stroke="#f2f2f5" stroke-opacity="0.22" stroke-width="2">
      <rect x="96" y="380" width="300" height="140"/>
      <rect x="465" y="380" width="300" height="140"/>
      <rect x="834" y="380" width="300" height="140"/>
      <rect x="1203" y="380" width="300" height="140"/>
    </g>
    <g stroke="#f49329" stroke-opacity="0.85" stroke-width="3" marker-end="url(#arrow)">
      <line x1="404" y1="450" x2="453" y2="450"/>
      <line x1="773" y1="450" x2="822" y2="450"/>
      <line x1="1142" y1="450" x2="1191" y2="450"/>
    </g>
    <g font-size="34" font-weight="700" fill="#f2f2f5" letter-spacing="2" text-anchor="middle">
      <text x="246" y="445">S3 API</text>
      <text x="615" y="445">QUEUE</text>
      <text x="984" y="445">WORKERS</text>
      <text x="1353" y="445">STORE</text>
    </g>
    <g font-size="22" fill="#f2f2f5" fill-opacity="0.45" letter-spacing="1" text-anchor="middle">
      <text x="246" y="487">presigned urls</text>
      <text x="615" y="487">rabbitmq</text>
      <text x="984" y="487">sharp · ffmpeg</text>
      <text x="1353" y="487">buckets · objects</text>
    </g>
  </g>

  <text x="96" y="640" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" fill="#f49329" fill-opacity="0.7" letter-spacing="4">AWS LAMBDA · AZURE FUNCTIONS · GCP · ON-PREM</text>

  <text x="96" y="820" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="96" font-weight="700" fill="#f2f2f5" letter-spacing="2">FILE STORAGE</text>
  <text x="96" y="930" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="96" font-weight="700" fill="#f2f2f5" letter-spacing="2">SYSTEM</text>
  <line x1="96" y1="985" x2="1504" y2="985" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
</svg>
